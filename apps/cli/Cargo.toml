[package]
name = "ollama-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool companion for Ollama GUI, executing filesystem tasks and listing models"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ollama-core = { path = "../../libs/core" }
ollama-api = { path = "../../libs/ollama-api" }
