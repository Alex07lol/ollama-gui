name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (r26b)
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Initialize Tauri Android (Non-Interactive)
        run: npx tauri android init --ci
        working-directory: apps/desktop

      - name: Build Android APK
        run: npx tauri android build --apk --target aarch64
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass mypassword -keypass mypassword -dname "CN=OllamaGUI, OU=Dev, O=OllamaGUI, L=Dev, S=Dev, C=US"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
          $APKSIGNER sign --ks my-release-key.jks --ks-pass pass:mypassword --out apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/ollama-gui.apk apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-gui-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/ollama-gui.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/ollama-gui.apk
          token: ${{ secrets.GITHUB_TOKEN }}
