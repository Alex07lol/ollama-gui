[package]
name = "ollama-api"
version = "0.1.0"
edition = "2021"
description = "Core Ollama API wrapper client for Ollama GUI"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
